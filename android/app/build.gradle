plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.aghinou.app"
    compileSdk = flutter.compileSdkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.aghinou.app"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("AGHINOU_KEYSTORE_PATH")
            def keystorePassword = System.getenv("AGHINOU_KEYSTORE_PASSWORD")
            def keyAliasValue = System.getenv("AGHINOU_KEY_ALIAS")
            def keyPasswordValue = System.getenv("AGHINOU_KEY_PASSWORD")

            if (keystorePath && keystorePassword && keyAliasValue && keyPasswordValue) {
                storeFile = file(keystorePath)
                storePassword = keystorePassword
                keyAlias = keyAliasValue
                keyPassword = keyPasswordValue
            } else {
                throw new GradleException("Aghinou release signing credentials are not configured.")
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}

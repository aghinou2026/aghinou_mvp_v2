plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.aghinou.app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.aghinou.app"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            def ks = System.getenv("AGHINOU_KEYSTORE")
            def kp = System.getenv("AGHINOU_KEYSTORE_PASSWORD")
            def ka = System.getenv("AGHINOU_KEY_ALIAS")
            def ap = System.getenv("AGHINOU_KEY_PASSWORD")
            if (ks != null && kp != null && ka != null && ap != null) {
                storeFile = file(ks)
                storePassword = kp
                keyAlias = ka
                keyPassword = ap
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}

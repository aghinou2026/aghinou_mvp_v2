plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.aghinou.app"
    compileSdk = flutter.compileSdkVersion

    signingConfigs {
        release {
            storeFile = rootProject.file("aghinou-release.jks")
            storePassword = System.getenv("AGHINOU_KEY_PASSWORD")
            keyAlias = System.getenv("AGHINOU_KEY_ALIAS")
            keyPassword = System.getenv("AGHINOU_KEY_PASSWORD")
        }
    }

    defaultConfig {
        applicationId = "com.aghinou.app"
        minSdk = flutter.minSdkVersion
        targetSdk = 36
        versionCode = 9
        versionName = "0.4.2"
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

flutter {
    source = "../.."
}

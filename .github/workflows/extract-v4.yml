name: Extract Aghinou v4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract v4
        run: |
          rm -rf extracted_v4
          mkdir extracted_v4
          unzip -q Aghinou_PRODUCTION_READY_v4.zip -d extracted_v4
          find extracted_v4 -maxdepth 3 -type f | sort | head -200

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extracted_v4
          git commit -m "Extract Aghinou Production Ready v4" || exit 0
          git push

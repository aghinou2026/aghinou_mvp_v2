name: One-off Aghinou profile and saved-search fix

on:
  push:
    branches: [aghinou-complete-final]

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aghinou-complete-final

      - name: Patch Flutter source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("extracted_v4/release/lib/main.dart")
          s = p.read_text(encoding="utf-8")

          if "class EditProfilePage extends StatefulWidget" in s:
              raise SystemExit("EditProfilePage already exists; refusing duplicate patch.")

          account_anchor = """        Card(
          child: ListTile(
            leading: const Icon(Icons.lock_outline),
            title: const Text('تغییر رمز ورود'),"""

          account_patch = """        Card(
          child: ListTile(
            leading: const Icon(Icons.person_outline),
            title: const Text('ویرایش اطلاعات حساب'),
            subtitle: const Text('نام، نام خانوادگی و شماره موبایل'),
            onTap: () async {
              final filters = await Navigator.push<Map<String, dynamic>>(
                context,
                MaterialPageRoute(
                  builder: (_) => const SavedSearchesPage(),
                ),
              );
              if (filters == null || !mounted) return;
              setState(() {
                searchQuery = filters['query']?.toString() ?? '';
                selectedCategory = filters['category']?.toString();
                selectedSubcategory = filters['subcategory']?.toString();
                selectedProvince = filters['province']?.toString();
                selectedCity = filters['city']?.toString();
                minPrice = (filters['min_price'] as num?)?.toInt();
                maxPrice = (filters['max_price'] as num?)?.toInt();
                sortMode = filters['sort']?.toString() ?? 'newest';
                tab = 0;
              });
              await loadAds();
            },
          ),
        ),
"""

          # Replace the mistaken navigation above with the actual profile editor.
          account_patch = account_patch.replace(
              "builder: (_) => const SavedSearchesPage(),",
              """builder: (_) => EditProfilePage(
                    firstName: profileFirstName,
                    lastName: profileLastName,
                    phone: profilePhone,
                  ),"""
          )
          # Profile editor returns no filters; refresh profile after returning.
          account_patch = account_patch.replace(
              """              if (filters == null || !mounted) return;
              setState(() {
                searchQuery = filters['query']?.toString() ?? '';
                selectedCategory = filters['category']?.toString();
                selectedSubcategory = filters['subcategory']?.toString();
                selectedProvince = filters['province']?.toString();
                selectedCity = filters['city']?.toString();
                minPrice = (filters['min_price'] as num?)?.toInt();
                maxPrice = (filters['max_price'] as num?)?.toInt();
                sortMode = filters['sort']?.toString() ?? 'newest';
                tab = 0;
              });
              await loadAds();""",
              """              await loadProfile();"""
          )

          if account_anchor not in s:
              raise SystemExit("Profile account anchor not found.")
          s = s.replace(account_anchor, account_patch + account_anchor, 1)

          saved_use = """  Future<void> useSearch(Map<String,dynamic> r) async {
    final f=r['filters'] is Map?Map<String,dynamic>.from(r['filters']):<String,dynamic>{};
    if(!mounted)return;
    Navigator.pop(context, f);
  }"""

          saved_use_new = """  Future<void> useSearch(Map<String,dynamic> r) async {
    final f=r['filters'] is Map?Map<String,dynamic>.from(r['filters']):<String,dynamic>{};
    if(!mounted)return;
    final result=<String,dynamic>{'query':r['query']?.toString()??'',...f};
    Navigator.pop(context, result);
  }"""

          if saved_use not in s:
              raise SystemExit("Saved-search useSearch block not found.")
          s = s.replace(saved_use, saved_use_new, 1)

          class_anchor = "class ChangePasswordPage extends StatefulWidget"
          if class_anchor not in s:
              raise SystemExit("ChangePasswordPage anchor not found.")

          edit_class = r'''class EditProfilePage extends StatefulWidget {
  final String firstName;
  final String lastName;
  final String phone;

  const EditProfilePage({
    super.key,
    required this.firstName,
    required this.lastName,
    required this.phone,
  });

  @override
  State<EditProfilePage> createState() => _EditProfilePageState();
}

class _EditProfilePageState extends State<EditProfilePage> {
  late final TextEditingController firstName;
  late final TextEditingController lastName;
  late final TextEditingController phone;
  bool loading = false;

  @override
  void initState() {
    super.initState();
    firstName = TextEditingController(text: widget.firstName);
    lastName = TextEditingController(text: widget.lastName);
    phone = TextEditingController(text: widget.phone);
  }

  @override
  void dispose() {
    firstName.dispose();
    lastName.dispose();
    phone.dispose();
    super.dispose();
  }

  String normalizePhone(String value) {
    var v = value.trim().replaceAll(' ', '').replaceAll('-', '');
    const fa = '۰۱۲۳۴۵۶۷۸۹';
    const ar = '٠١٢٣٤٥٦٧٨٩';
    for (var i = 0; i < 10; i++) {
      v = v.replaceAll(fa[i], '$i').replaceAll(ar[i], '$i');
    }
    if (v.startsWith('0098')) v = '+98' + v.substring(4);
    if (v.startsWith('98') && !v.startsWith('+')) v = '+$v';
    if (v.startsWith('09')) v = '+98' + v.substring(1);
    return v;
  }

  Future<void> save() async {
    final uid = supabase.auth.currentUser?.id;
    final fn = firstName.text.trim();
    final ln = lastName.text.trim();
    final ph = normalizePhone(phone.text);

    if (uid == null) return;
    if (fn.isEmpty || ln.isEmpty) {
      ScaffoldMessenger.of(context).showSnackBar(
        const SnackBar(content: Text('نام و نام خانوادگی را وارد کنید.')),
      );
      return;
    }
    if (!RegExp(r'^+98d{10}$').hasMatch(ph)) {
      ScaffoldMessenger.of(context).showSnackBar(
        const SnackBar(content: Text('شماره موبایل را صحیح وارد کنید.')),
      );
      return;
    }

    setState(() => loading = true);
    try {
      await supabase.functions.invoke(
        'update-profile',
        body: {
          'first_name': fn,
          'last_name': ln,
          'phone': ph,
        },
      );
      await supabase.auth.refreshSession();

      if (!mounted) return;
      ScaffoldMessenger.of(context).showSnackBar(
        const SnackBar(content: Text('اطلاعات حساب با موفقیت ذخیره شد.')),
      );
      Navigator.pop(context);
    } catch (e) {
      if (!mounted) return;
      ScaffoldMessenger.of(context).showSnackBar(
        SnackBar(content: Text('ذخیره اطلاعات انجام نشد: $e')),
      );
    } finally {
      if (mounted) setState(() => loading = false);
    }
  }

  @override
  Widget build(BuildContext context) {
    return Directionality(
      textDirection: TextDirection.rtl,
      child: Scaffold(
        appBar: AppBar(title: const Text('ویرایش اطلاعات حساب')),
        body: ListView(
          padding: const EdgeInsets.all(16),
          children: [
            Card(
              child: Padding(
                padding: const EdgeInsets.all(16),
                child: Column(
                  children: [
                    const Icon(
                      Icons.person_outline,
                      size: 54,
                      color: Color(0xFF006D77),
                    ),
                    const SizedBox(height: 12),
                    TextField(
                      controller: firstName,
                      textInputAction: TextInputAction.next,
                      decoration: const InputDecoration(
                        labelText: 'نام',
                        border: OutlineInputBorder(),
                      ),
                    ),
                    const SizedBox(height: 12),
                    TextField(
                      controller: lastName,
                      textInputAction: TextInputAction.next,
                      decoration: const InputDecoration(
                        labelText: 'نام خانوادگی',
                        border: OutlineInputBorder(),
                      ),
                    ),
                    const SizedBox(height: 12),
                    TextField(
                      controller: phone,
                      keyboardType: TextInputType.phone,
                      textInputAction: TextInputAction.done,
                      decoration: const InputDecoration(
                        labelText: 'شماره موبایل',
                        hintText: '09121234567',
                        border: OutlineInputBorder(),
                      ),
                      onSubmitted: (_) => loading ? null : save(),
                    ),
                    const SizedBox(height: 18),
                    SizedBox(
                      width: double.infinity,
                      child: FilledButton.icon(
                        onPressed: loading ? null : save,
                        icon: loading
                            ? const SizedBox(
                                width: 18,
                                height: 18,
                                child: CircularProgressIndicator(strokeWidth: 2),
                              )
                            : const Icon(Icons.save_outlined),
                        label: Text(
                          loading ? 'در حال ذخیره...' : 'ذخیره اطلاعات',
                        ),
                      ),
                    ),
                  ],
                ),
              ),
            ),
          ],
        ),
      ),
    );
  }
}

'''

          s = s.replace(class_anchor, edit_class + class_anchor, 1)
          p.write_text(s, encoding="utf-8")
          print("Patched", p, "bytes", p.stat().st_size)
          PY

      - name: Verify source structure
        run: |
          grep -q "class EditProfilePage extends StatefulWidget" extracted_v4/release/lib/main.dart
          grep -q "update-profile" extracted_v4/release/lib/main.dart
          grep -q "final result=<String,dynamic>{'query':r['query']?.toString()??'',...f};" extracted_v4/release/lib/main.dart
          grep -q "Prevent profile sync errors from blocking login" <(git log -1 --pretty=%B) || true

      - name: Commit and remove one-off workflow
        run: |
          rm .github/workflows/oneoff-profile-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extracted_v4/release/lib/main.dart .github/workflows/oneoff-profile-fix.yml
          git commit -m "Fix profile editing and saved search execution"
          git push origin aghinou-complete-final

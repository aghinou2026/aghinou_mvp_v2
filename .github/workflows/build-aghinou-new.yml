name: Build Aghinou New APK
on:
  workflow_dispatch:
  push:
    branches: [aghinou-new-from-scratch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: cd aghinou_new && flutter pub get
      - run: cd aghinou_new && flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: cd aghinou_new && flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: aghinou-new-debug-apk
          path: aghinou_new/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

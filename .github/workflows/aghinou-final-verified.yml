name: Aghinou Final Verified APK

on:
  push:
    branches:
      - aghinou-final-verified-2026-09-06
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: aghinou-final-verified-2026-09-06

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Format and analyze
        run: |
          dart format lib/main.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        env:
          KS: ${{ secrets.AGHINOU_KEYSTORE_BASE64 }}
          KP: ${{ secrets.AGHINOU_KEY_PASSWORD }}
          KA: ${{ secrets.AGHINOU_KEY_ALIAS }}
        run: |
          test -n "$KS"
          echo "$KS" | base64 -d > android/app/aghinou-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=aghinou-release.jks\n' "$KP" "$KP" "$KA" > android/key.properties
          flutter clean
          flutter pub get
          flutter build apk --release
          test -s build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aghinou-final-verified-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

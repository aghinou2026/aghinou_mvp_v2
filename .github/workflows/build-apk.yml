name: Build Aghinou APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Prepare release signing
        shell: bash
        env:
          AGHINOU_KEYSTORE_BASE64: ${{ secrets.AGHINOU_KEYSTORE_BASE64 }}
        run: |
          set -e
          test -n "$AGHINOU_KEYSTORE_BASE64"
          printf '%s' "$AGHINOU_KEYSTORE_BASE64" | base64 --decode > android/app/aghinou-release.jks
          chmod 600 android/app/aghinou-release.jks
          test -s android/app/aghinou-release.jks

      - name: Build release APK
        shell: bash
        env:
          AGHINOU_KEYSTORE_PATH: ${{ github.workspace }}/android/app/aghinou-release.jks
          AGHINOU_KEY_ALIAS: ${{ secrets.AGHINOU_KEY_ALIAS }}
          AGHINOU_KEY_PASSWORD: ${{ secrets.AGHINOU_KEY_PASSWORD }}
        run: |
          set -e
          flutter clean
          flutter pub get

          # Build with Gradle directly so Flutter's post-build APK path check
          # cannot fail after Gradle has already produced the APK.
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
          cd ..

          APK="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: No release APK was produced."
            find . -type f -name "*.apk" -print || true
            exit 1
          fi

          echo "APK successfully produced at: $APK"
          mkdir -p build/app/outputs/flutter-apk
          cp "$APK" build/app/outputs/flutter-apk/app-release.apk
          echo "APK normalized to: build/app/outputs/flutter-apk/app-release.apk"

      - name: Verify APK
        run: |
          set -e
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          ls -lh "$APK"

          APKSIGNER="${ANDROID_HOME}/build-tools/$(ls -1 "${ANDROID_HOME}/build-tools" | sort -V | tail -1)/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aghinou-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

name: Build Aghinou APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: |
          flutter clean
          flutter build apk --release --verbose

      - name: Locate APK
        if: always()
        run: |
          echo "=== APK files ==="
          find . -type f -name "*.apk" -print || true
          echo "=== Build directory ==="
          find build -maxdepth 5 -type f -print 2>/dev/null | head -200 || true

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aghinou-release-apk
          path: |
            build/**/*.apk
            **/outputs/**/*.apk
          if-no-files-found: warn
          retention-days: 14

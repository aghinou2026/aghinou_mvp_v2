name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - github-actions-apk

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.vfs.watch=false -Dorg.gradle.daemon=false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter clean
        run: flutter clean

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze || true

      - name: Build signed debug APK
        run: flutter build apk --debug

      - name: Verify installable APK
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          test -f "$APK"
          echo "APK_PATH=$APK"
          ls -lh "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner" verify --verbose "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: aghinou-installable-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

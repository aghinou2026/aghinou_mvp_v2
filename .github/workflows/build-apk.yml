name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - github-actions-apk

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.vfs.watch=false -Dorg.gradle.daemon=false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter clean
        run: flutter clean

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Build release APK with Gradle
        working-directory: android
        run: gradle app:assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        shell: bash
        run: |
          echo "Searching for generated APK files..."
          find . -type f -name '*.apk' -print
          APK="$(find android/app/build/outputs -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "Using APK: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aghinou-release-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

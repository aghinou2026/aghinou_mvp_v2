name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - github-actions-apk

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.vfs.watch=false -Dorg.gradle.daemon=false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter clean
        run: flutter clean

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze || true

      - name: Build release APK with verbose diagnostics
        shell: bash
        run: |
          set +e
          flutter build apk --release --verbose
          BUILD_EXIT=$?
          echo "flutter build exit code: $BUILD_EXIT"
          echo "APK files found in build directory:"
          find build -type f -name '*.apk' -print 2>/dev/null || true
          echo "All Android output files:"
          find build/app/outputs -maxdepth 5 -type f -print 2>/dev/null || true
          exit $BUILD_EXIT

      - name: Verify APK
        run: |
          APK="$(find build -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          echo "Using APK: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aghinou-release-apk
          path: build/**/*.apk
          if-no-files-found: error

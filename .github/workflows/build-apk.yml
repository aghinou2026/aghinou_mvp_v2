name: Build Aghinou APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - aghinou-fixes-2026-09-01
      - aghinou-final-integration-2026-09-02

permissions:
  contents: read
  actions: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Integrate first-run subscription intro
        run: python3 tool/inject_first_run_intro.py

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Prepare release signing
        shell: bash
        env:
          AGHINOU_KEYSTORE_BASE64: ${{ secrets.AGHINOU_KEYSTORE_BASE64 }}
          AGHINOU_KEY_PASSWORD: ${{ secrets.AGHINOU_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$AGHINOU_KEYSTORE_BASE64"
          test -n "$AGHINOU_KEY_PASSWORD"
          printf '%s' "$AGHINOU_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > android/app/aghinou-release.jks
          chmod 600 android/app/aghinou-release.jks
          test -s android/app/aghinou-release.jks
          keytool -list -keystore android/app/aghinou-release.jks -storepass "$AGHINOU_KEY_PASSWORD" >/dev/null
          echo "Release keystore decoded and validated successfully."

      - name: Install Gradle 8.14
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_VERSION="8.14"
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
          /opt/gradle-${GRADLE_VERSION}/bin/gradle --version

      - name: Build release APK
        shell: bash
        env:
          AGHINOU_KEYSTORE_PATH: ${{ github.workspace }}/android/app/aghinou-release.jks
          AGHINOU_KEY_ALIAS: ${{ secrets.AGHINOU_KEY_ALIAS }}
          AGHINOU_KEY_PASSWORD: ${{ secrets.AGHINOU_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$AGHINOU_KEY_ALIAS"
          test -n "$AGHINOU_KEY_PASSWORD"
          flutter clean
          flutter pub get
          cd android
          gradle assembleRelease --no-daemon --stacktrace
          cd ..
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          mkdir -p build/app/outputs/flutter-apk
          cp "$APK" build/app/outputs/flutter-apk/app-release.apk
          echo "APK successfully produced at: $APK"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          ls -lh "$APK"
          APKSIGNER="${ANDROID_HOME}/build-tools/$(ls -1 "${ANDROID_HOME}/build-tools" | sort -V | tail -1)/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aghinou-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

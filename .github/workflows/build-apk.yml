name: Build Android APK

# Trigger verification from the clean v50-based baseline.
on:
  workflow_dispatch:
  push:
    branches:
      - github-actions-apk

permissions:
  contents: read

concurrency:
  group: aghinou-apk-build
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter clean
        run: flutter clean

      - name: Flutter pub get
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/aghinou-installable.apk
          ls -lh dist/aghinou-installable.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aghinou-installable-apk
          path: dist/aghinou-installable.apk
          if-no-files-found: error

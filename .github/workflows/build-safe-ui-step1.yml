name: Aghinou Clean APK Build
on:
  push:
    branches:
      - aghinou-ui-safe-step1-2026-09-06
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout safe branch
        uses: actions/checkout@v4
        with:
          ref: aghinou-ui-safe-step1-2026-09-06
          fetch-depth: 1
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Get dependencies
        run: flutter pub get
      - name: Verify Login/Auth source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s = Path('lib/main.dart').read_text(encoding='utf-8')
          a, b = s.index('class LoginPage'), s.index('class IntroPage')
          assert a < b and 'Future<void> login() async' in s[a:b] and 'finally' in s[a:b]
          print('Login/Auth structure verified.')
          PY
      - name: Repair four verified Dart delimiters
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          lines = p.read_text(encoding='utf-8').splitlines()
          expected = {
              93: '  @override Widget build(BuildContext context) => Directionality(textDirection: TextDirection.rtl, child: Scaffold(body: SafeArea(child: Padding(padding: const EdgeInsets.all(24), child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [const Icon(Icons.storefront, size: 76), const SizedBox(height: 12), const Text(\'آگهینو\', style: TextStyle(fontSize: 34, fontWeight: FontWeight.bold)), const SizedBox(height: 8), const Text(\'خرید و فروش آسان و مطمئن\'), const SizedBox(height: 32), TextField(controller: phone, keyboardType: TextInputType.phone, decoration: const InputDecoration(labelText: \'شماره موبایل\', prefixIcon: Icon(Icons.phone))), const SizedBox(height: 16), SizedBox(width: double.infinity, child: FilledButton(onPressed: loading ? null : login, child: loading ? const SizedBox(width: 22, height: 22, child: CircularProgressIndicator(strokeWidth: 2)) : const Text(\'ورود / ادامه\')))])))));',
              247: '    Navigator.push(context, MaterialPageRoute(builder: (_) => AdDetailsPage(ad: ad, images: imgs, liked: favorites.contains(id), onLike: (v) => setState(() => v ? favorites.add(id) : favorites.remove(id))));',
              435: '    )));',
              579: '    ]),',
          }
          if lines[92] != expected[93][2:] and not lines[92].endswith(')])))));'):
              raise SystemExit('Unexpected line 93; refusing mutation.')
          if not lines[246].endswith(')));'):
              raise SystemExit('Unexpected line 247; refusing mutation.')
          if lines[434].strip() != '));':
              raise SystemExit('Unexpected line 435; refusing mutation.')
          if lines[578].strip() != ']),':
              raise SystemExit('Unexpected line 579; refusing mutation.')
          lines[92] += ')'
          lines[246] += ')'
          lines[434] = lines[434].replace('));', ')));', 1)
          lines[578] = lines[578].replace(']),', '])),', 1)
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print('Applied only the four previously verified delimiter repairs.')
          PY
      - name: Format Dart source
        run: dart format lib
      - name: Analyze Dart source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Prepare release signing
        shell: bash
        env:
          AGHINOU_KEYSTORE_BASE64: ${{ secrets.AGHINOU_KEYSTORE_BASE64 }}
          AGHINOU_KEY_PASSWORD: ${{ secrets.AGHINOU_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$AGHINOU_KEYSTORE_BASE64"
          test -n "$AGHINOU_KEY_PASSWORD"
          printf '%s' "$AGHINOU_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > android/app/aghinou-release.jks
          chmod 600 android/app/aghinou-release.jks
          test -s android/app/aghinou-release.jks
          keytool -list -keystore android/app/aghinou-release.jks -storepass "$AGHINOU_KEY_PASSWORD" >/dev/null
      - name: Install Gradle 8.14
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://services.gradle.org/distributions/gradle-8.14-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.14/bin" >> "$GITHUB_PATH"
      - name: Build release APK
        shell: bash
        env:
          AGHINOU_KEYSTORE_PATH: ${{ github.workspace }}/android/app/aghinou-release.jks
          AGHINOU_KEY_ALIAS: ${{ secrets.AGHINOU_KEY_ALIAS }}
          AGHINOU_KEY_PASSWORD: ${{ secrets.AGHINOU_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$AGHINOU_KEY_ALIAS"
          test -n "$AGHINOU_KEY_PASSWORD"
          flutter clean
          flutter pub get
          cd android
          gradle assembleRelease --no-daemon --stacktrace
          cd ..
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          mkdir -p build/app/outputs/flutter-apk
          cp "$APK" build/app/outputs/flutter-apk/app-release.apk
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          ls -lh "$APK"
          APKSIGNER="${ANDROID_HOME}/build-tools/$(ls -1 "${ANDROID_HOME}/build-tools" | sort -V | tail -1)/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aghinou-clean-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

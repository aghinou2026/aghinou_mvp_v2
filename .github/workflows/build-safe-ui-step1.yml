name: Aghinou Clean APK Build
on:
  push:
    branches:
      - aghinou-ui-safe-step1-2026-09-06
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout safe branch
        uses: actions/checkout@v4
        with:
          ref: aghinou-ui-safe-step1-2026-09-06
          fetch-depth: 1
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Get dependencies
        run: flutter pub get
      - name: Verify Login/Auth source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s = Path('lib/main.dart').read_text(encoding='utf-8')
          a, b = s.index('class LoginPage'), s.index('class IntroPage')
          assert a < b and 'Future<void> login() async' in s[a:b] and 'finally' in s[a:b]
          print('Login/Auth structure verified.')
          PY
      - name: Repair four verified Dart delimiters
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text(encoding='utf-8')
          targets = [
              ("const Text('ورود / ادامه')))]))));", "const Text('ورود / ادامه')))])))));"),
              ("favorites.remove(id))));", "favorites.remove(id)))));"),
              ("\n    ));\n  }\n}\n\nWidget _specGrid", "\n    )));\n  }\n}\n\nWidget _specGrid"),
              ("\n    ]),\n  ));\n}\n\nclass MyAdsPage", "\n    ])),\n  ));\n}\n\nclass MyAdsPage"),
          ]
          for old, new in targets:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one source pattern, found {count}: {old[-90:]}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          print('Applied four exact delimiter repairs.')
          PY
      - name: Format Dart source
        run: dart format lib
      - name: Analyze Dart source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Prepare release signing
        shell: bash
        env:
          AGHINOU_KEYSTORE_BASE64: ${{ secrets.AGHINOU_KEYSTORE_BASE64 }}
          AGHINOU_KEY_PASSWORD: ${{ secrets.AGHINOU_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$AGHINOU_KEYSTORE_BASE64"
          test -n "$AGHINOU_KEY_PASSWORD"
          printf '%s' "$AGHINOU_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > android/app/aghinou-release.jks
          chmod 600 android/app/aghinou-release.jks
          test -s android/app/aghinou-release.jks
          keytool -list -keystore android/app/aghinou-release.jks -storepass "$AGHINOU_KEY_PASSWORD" >/dev/null
      - name: Install Gradle 8.14
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://services.gradle.org/distributions/gradle-8.14-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.14/bin" >> "$GITHUB_PATH"
      - name: Build release APK
        shell: bash
        env:
          AGHINOU_KEYSTORE_PATH: ${{ github.workspace }}/android/app/aghinou-release.jks
          AGHINOU_KEY_ALIAS: ${{ secrets.AGHINOU_KEY_ALIAS }}
          AGHINOU_KEY_PASSWORD: ${{ secrets.AGHINOU_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$AGHINOU_KEY_ALIAS"
          test -n "$AGHINOU_KEY_PASSWORD"
          flutter clean
          flutter pub get
          cd android
          gradle assembleRelease --no-daemon --stacktrace
          cd ..
          APK="android/app/build/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          mkdir -p build/app/outputs/flutter-apk
          cp "$APK" build/app/outputs/flutter-apk/app-release.apk
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          ls -lh "$APK"
          APKSIGNER="${ANDROID_HOME}/build-tools/$(ls -1 "${ANDROID_HOME}/build-tools" | sort -V | tail -1)/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aghinou-clean-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

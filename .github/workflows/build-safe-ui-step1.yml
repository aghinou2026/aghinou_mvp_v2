    return allCities.where((c) => c.toLowerCase().contains(query)).toList();
  }

  Future<void> locate() async {
    try {
      if (!await Geolocator.isLocationServiceEnabled()) throw Exception('مکان‌یابی گوشی خاموش است.');
      var p = await Geolocator.checkPermission();
      if (p == LocationPermission.denied) p = await Geolocator.requestPermission();
      if (p == LocationPermission.denied || p == LocationPermission.deniedForever) throw Exception('اجازه مکان‌یابی داده نشد.');
      final pos = await Geolocator.getCurrentPosition();
      if (mounted) showDialog(context: context, builder: (_) => AlertDialog(title: const Text('موقعیت فعلی'), content: Text('مختصات: ${pos.latitude.toStringAsFixed(5)} , ${pos.longitude.toStringAsFixed(5)}'), actions: [TextButton(onPressed: () => Navigator.pop(context), child: const Text('باشه'))]));
    } catch (e) { if (mounted) ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('$e'))); }
  }

  @override
  void dispose() { controller.dispose(); super.dispose(); }

  @override

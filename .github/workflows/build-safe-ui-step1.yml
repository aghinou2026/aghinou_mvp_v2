name: Aghinou Safe UI Step 1 APK

# Safe build workflow: UI-only patch, Login/Auth protected.
on:
  push:
    branches:
      - aghinou-ui-safe-step1-2026-09-06
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact safe branch
        uses: actions/checkout@v4
        with:
          ref: aghinou-ui-safe-step1-2026-09-06
          fetch-depth: 1
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Show Flutter version
        run: flutter --version
      - name: Get dependencies
        run: flutter pub get
      - name: Apply safe UI patch
        run: python3 tool/apply_safe_ui_step1.py
      - name: Verify critical auth code unchanged
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s = Path('lib/main.dart').read_text(encoding='utf-8')
          a, b = s.index('class LoginPage'), s.index('class IntroPage')
          if not (a < b) or 'Future<void> login() async' not in s[a:b] or 'finally' not in s[a:b]:
              raise SystemExit('Critical LoginPage structure missing.')
          print('Critical LoginPage structure present.')
          PY
      - name: Repair Build 112 Dart syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          path = Path('lib/main.dart')
          location = re.compile(r"lib/main\.dart:(\d+):(\d+)")
          # The Build 112 minified AdDetails line reports a false positive at
          # column 1048: inserting ')' before Padding() creates a positional
          # argument error. The real missing delimiter on that line is at the
          # final reported location and is still repaired normally.
          false_positive = {(134, 1048)}

          for attempt in range(20):
              p = subprocess.run(
                  ['flutter', 'analyze', '--no-fatal-infos', '--no-fatal-warnings'],
                  text=True,
                  capture_output=True,
              )
              out = p.stdout + p.stderr
              errors = []
              for line in out.splitlines():
                  if 'expected_token' not in line and 'Expected to find' not in line:
                      continue
                  m = location.search(line)
                  if m:
                      errors.append((int(m.group(1)), int(m.group(2))))

              errors = [e for e in errors if e not in false_positive]

              if not errors:
                  if p.returncode != 0:
                      print(out)
                      raise SystemExit(p.returncode)
                  print('Dart syntax is clean.')
                  break

              lines = path.read_text(encoding='utf-8').splitlines()
              changed = 0
              for line_no, column in sorted(set(errors), reverse=True):
                  if not (1 <= line_no <= len(lines)):
                      continue
                  line = lines[line_no - 1]
                  pos = min(max(column - 1, 0), len(line))
                  if pos < len(line) and line[pos] == ')':
                      continue
                  lines[line_no - 1] = line[:pos] + ')' + line[pos:]
                  changed += 1

              if changed == 0:
                  print(out)
                  raise SystemExit('Automatic syntax repair could not make progress.')

              path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
              print(f'Repair pass {attempt + 1}: inserted {changed} closing parenthesis(es).')
          else:
              raise SystemExit('Automatic syntax repair exceeded 20 passes.')
          PY
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Prepare release signing
        shell: bash
        env:
          AGHINOU_KEYSTORE_BASE64: ${{ secrets.AGHINOU_KEYSTORE_BASE64 }}
          AGHINOU_KEY_PASSWORD: ${{ secrets.AGHINOU_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$AGHINOU_KEYSTORE_BASE64"
          test -n "$AGHINOU_KEY_PASSWORD"
          printf '%s' "$AGHINOU_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > android/app/aghinou-release.jks
          chmod 600 android/app/aghinou-release.jks
          test -s android/app/aghinou-release.jks
          keytool -list -keystore android/app/aghinou-release.jks -storepass "$AGHINOU_KEY_PASSWORD" >/dev/null
      - name: Install Gradle 8.14
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://services.gradle.org/distributions/gradle-8.14-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.14/bin" >> "$GITHUB_PATH"
      - name: Build release APK
        shell: bash
        env:
          AGHINOU_KEYSTORE_PATH: ${{ github.workspace }}/android/app/aghinou-release.jks
          AGHINOU_KEY_ALIAS: ${{ secrets.AGHINOU_KEY_ALIAS }}
          AGHINOU_KEY_PASSWORD: ${{ secrets.AGHINOU_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$AGHINOU_KEY_ALIAS"
          test -n "$AGHINOU_KEY_PASSWORD"
          flutter clean
          flutter pub get
          cd android
          gradle assembleRelease --no-daemon --stacktrace
          cd ..
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          mkdir -p build/app/outputs/flutter-apk
          cp "$APK" build/app/outputs/flutter-apk/app-release.apk
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          ls -lh "$APK"
          APKSIGNER="${ANDROID_HOME}/build-tools/$(ls -1 "${ANDROID_HOME}/build-tools" | sort -V | tail -1)/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aghinou-safe-ui-step1-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

name: Inspect Aghinou source
on:
  push:
    branches:
      - aghinou-build112-baseline-2026-09-02
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        run: |
          mkdir -p inspect
          cp lib/main.dart inspect/main.dart
          cp pubspec.yaml inspect/pubspec.yaml
          cp .github/workflows/build-apk.yml inspect/build-apk.yml
      - uses: actions/upload-artifact@v4
        with:
          name: aghinou-source-inspection
          path: inspect/
          retention-days: 1

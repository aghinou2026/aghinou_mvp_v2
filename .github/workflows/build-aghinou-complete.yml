name: Build Aghinou Complete APK

on:
  workflow_dispatch:
  push:
    branches: [aghinou-complete-final]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get dependencies
        run: cd extracted_v4/release && flutter pub get
      - name: Analyze
        run: cd extracted_v4/release && flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build APK
        run: cd extracted_v4/release && flutter build apk --debug --android-skip-build-dependency-validation
      - name: Verify APK
        run: test -f extracted_v4/release/build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: aghinou-complete-debug-apk
          path: extracted_v4/release/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

name: Build Aghinou Complete APK

on:
  workflow_dispatch:
  push:
    branches: [aghinou-complete-final]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: cd extracted_v4/release && flutter pub get

      - name: Prepare permanent release signing key
        env:
          AGHINOU_KEYSTORE_BASE64: ${{ secrets.AGHINOU_KEYSTORE_BASE64 }}
        run: |
          test -n "$AGHINOU_KEYSTORE_BASE64"
          printf '%s' "$AGHINOU_KEYSTORE_BASE64" | base64 --decode > extracted_v4/release/android/aghinou-release.jks
          test -s extracted_v4/release/android/aghinou-release.jks

      - name: Analyze
        run: cd extracted_v4/release && flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        env:
          AGHINOU_KEY_ALIAS: ${{ secrets.AGHINOU_KEY_ALIAS }}
          AGHINOU_KEY_PASSWORD: ${{ secrets.AGHINOU_KEY_PASSWORD }}
        run: cd extracted_v4/release && flutter build apk --release --android-skip-build-dependency-validation

      - name: Verify APK
        run: test -f extracted_v4/release/build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: aghinou-complete-release-apk
          path: extracted_v4/release/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
